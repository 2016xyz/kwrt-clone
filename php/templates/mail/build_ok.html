<p style="margin:0 0 14px;font-size:15px">你好 <b>{{username}}</b>：</p>
<p style="margin:0 0 18px;color:#334155;line-height:1.75">
  你定制的固件已构建完成。<br>
  目标设备：<b>{{target}} / {{profile}}</b><br>
  固件版本：<b>{{version}}</b><br>
  文件数量：<b>{{count}}</b> 个 &middot; 构建耗时 <b>{{duration}}</b>
</p>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"
       style="border:1px solid #e2e8f0;border-radius:8px;overflow:hidden;font-size:14px">
  <tr style="background:#f1f5f9">
    <th align="left" style="padding:10px 14px;font-size:12px;color:#64748b;
                            text-transform:uppercase;letter-spacing:.4px">文件名</th>
    <th align="right" style="padding:10px 14px;font-size:12px;color:#64748b;
                             text-transform:uppercase;letter-spacing:.4px">大小</th>
  </tr>
  {{rows}}
</table>
<p style="margin:18px 0 0;font-size:13px;color:#b45309;background:#fef3c7;
          border:1px solid #fde68a;border-radius:8px;padding:11px 14px;line-height:1.7">
  注意：以上链接 <b>{{hours}} 小时内有效</b>，过期后请回到站点重新生成。
</p>
