<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{title}}</title></head>
<body style="margin:0;padding:0;background:#f1f5f9;-webkit-text-size-adjust:100%">
<!-- 邮件客户端兼容：外层 table 撑满 + 内层固定 600px，居中 -->
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"
       style="background:#f1f5f9;padding:28px 12px">
<tr><td align="center">
  <table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0"
         style="width:100%;max-width:600px;background:#ffffff;border:1px solid #e2e8f0;
                border-radius:12px;overflow:hidden;
                font-family:system-ui,-apple-system,'Segoe UI',Roboto,'Noto Sans SC',
                'PingFang SC','Microsoft YaHei',sans-serif;color:#0f172a">
    <tr>
      <td style="background:{{accent}};padding:20px 26px;color:#ffffff;
                 font-size:17px;font-weight:700;letter-spacing:.3px">
        {{site}}
      </td>
    </tr>
    <tr><td style="padding:26px 26px 8px">{{content}}</td></tr>
    <tr>
      <td style="padding:16px 26px 20px;background:#f8fafc;border-top:1px solid #e2e8f0;
                 font-size:12px;color:#94a3b8;line-height:1.7">
        此邮件由 {{site}} 自动发送，请勿直接回复。<br>
        如果你并未在本站发起相关操作，请忽略本邮件。
      </td>
    </tr>
  </table>
</td></tr>
</table>
</body></html>
