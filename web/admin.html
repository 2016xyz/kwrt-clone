<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>管理控制台 · 夏诗意</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
<link rel="stylesheet" href="/assets/css/app.css">
</head>
<body>
<a class="skip-link" href="#main">跳到主要内容</a>

<div id="app" v-cloak>
  <div class="boot" v-if="authChecked === false">
    <div class="boot-spinner"></div>
    <div class="fs-sm">正在校验管理权限…</div>
  </div>

  <!-- 无权限 -->
  <div v-if="authChecked && !isAdmin" class="container container-tight"
       style="padding-top:14vh;text-align:center">
    <div class="card card-pad-lg">
      <div style="display:flex;justify-content:center;margin-bottom:var(--sp-4);color:var(--s-danger)">
        <svg viewBox="0 0 24 24" width="56" height="56" fill="none" stroke="currentColor"
             stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="4" y="10.5" width="16" height="10.5" rx="2.2"/><path d="M8 10.5V7a4 4 0 0 1 8 0v3.5"/>
        </svg>
      </div>
      <h3>需要管理员权限</h3>
      <p class="text-muted mt-3">
        {{ me.logged_in ? '当前账号（' + me.username + '）不是管理员。' : '请先登录管理员账号。' }}
      </p>
      <div class="stack-sm mt-6" style="max-width:280px;margin-left:auto;margin-right:auto">
        <a class="btn btn-primary btn-block" href="/login/?next=/admin/">去登录</a>
        <a class="btn btn-outline btn-block" href="/">返回首页</a>
      </div>
    </div>
  </div>

  <!-- 管理台 -->
  <template v-if="authChecked && isAdmin">
    <header class="site-header">
      <div class="inner">
        <a class="brand" href="/">
          <img :src="site.logo_url || '/static/logo.svg'" :alt="site.site_short || '夏诗意'">
          <span class="brand-text">{{ site.site_short || '夏诗意' }}</span>
        </a>
        <span class="badge badge-danger header-badge">管理控制台</span>
        <span class="badge header-badge version-badge" :title="'当前版本 ' + (site.version || '')">
          {{ site.version || 'v?' }}
        </span>
        <span class="spacer"></span>
        <div class="nav-links">
          <a class="nav-link desktop" href="/">返回站点</a>
          <theme-toggle></theme-toggle>
          <button class="btn btn-ghost btn-sm" @click="logout">退出</button>
        </div>
      </div>
    </header>

    <div class="admin-shell">
      <!-- 侧边导航 -->
      <nav class="admin-nav" aria-label="管理模块">
        <button v-for="t in tabs" :key="t.k" class="admin-nav-item"
                :class="{ on: tab === t.k }" @click="go(t.k)">
          <span v-html="t.icon"></span>
          <span>{{ t.label }}</span>
          <span class="badge badge-danger" v-if="t.badge && badges[t.badge]">{{ badges[t.badge] }}</span>
        </button>
      </nav>

      <!-- 内容区 -->
      <main class="admin-body" id="main">

        <!-- ============ 总览 ============ -->
        <section v-if="tab === 'ov'">
          <div class="row-between mb-5">
            <div>
              <h2>总览</h2>
              <p class="text-muted fs-sm mt-1">站点运行状态一览</p>
            </div>
            <button class="btn btn-outline btn-sm" :class="{ 'is-loading': loading.ov }" @click="loadOverview">
              刷新
            </button>
          </div>

          <div class="grid grid-auto-sm mb-5">
            <div class="kpi"><div class="kpi-label">注册用户</div>
              <div class="kpi-value">{{ ov.users || 0 }}</div>
              <div class="kpi-sub">其中赞助 {{ ov.sponsors || 0 }} 人</div></div>
            <div class="kpi"><div class="kpi-label">构建任务</div>
              <div class="kpi-value">{{ ov.builds || 0 }}</div>
              <div class="kpi-sub">完成 {{ ov.builds_done || 0 }}</div></div>
            <div class="kpi"><div class="kpi-label">队列</div>
              <div class="kpi-value">{{ ov.queue_running || 0 }}<span class="fs-sm text-muted">/{{ ov.concurrency || 2 }}</span></div>
              <div class="kpi-sub">运行中 / 并发上限</div></div>
            <div class="kpi"><div class="kpi-label">下载链接</div>
              <div class="kpi-value">{{ ov.dl_active || 0 }}</div>
              <div class="kpi-sub">累计 {{ ov.dl_total || 0 }} 个</div></div>
            <div class="kpi kpi-accent" v-if="ov.sponsor_total_amount">
              <div class="kpi-label">已支付金额</div>
              <div class="kpi-value">{{ ov.sponsor_total_amount || 0 }}</div>
              <div class="kpi-sub">{{ ov.active_sponsors || 0 }} 位赞助用户</div></div>
            <div class="kpi"><div class="kpi-label">磁盘占用</div>
              <div class="kpi-value fs-xl" style="line-height:1.5">{{ ov.disk || '—' }}</div>
              <div class="kpi-sub">产物存储</div></div>
          </div>

          <div class="grid grid-2">
            <div class="card">
              <h4 class="mb-3">运行配置</h4>
              <div class="stack-sm">
                <!-- 系统版本放在运行配置首行：出问题第一时间要看的就是「跑的是哪一版」。
                     取值走 site.version（与页头徽标同源），由 /api/v1/site 下发，
                     避免在模板里再写死一个常量、早晚和后端跑偏。
                     注意：这是纯静态 HTML（Vue 前端），注释只能用 HTML 注释。 -->
                <div class="kv"><span class="kv-k">系统版本</span>
                  <span class="kv-v">
                    <span class="badge badge-primary mono">{{ site.version || '—' }}</span>
                    <!-- 检查更新（GitHub）：只查询，不改动任何文件。
                         未配置更新源仓库时禁用，并把原因放在 title 里。 -->
                    <button class="btn btn-xs btn-outline" style="margin-left:.5rem"
                            @click="checkUpdate(false)"
                            :disabled="upd.busy || !(ov.update && ov.update.configured)"
                            :title="(ov.update && ov.update.configured)
                              ? ('更新源：' + ov.update.repo + '（结果缓存 ' + (ov.update.cache_minutes || 10) + ' 分钟）')
                              : '未配置更新源仓库：站点设置 → 程序更新'">
                      {{ upd.busy ? '检查中…' : '检查更新' }}</button>
                    <button class="btn btn-xs btn-ghost" v-if="upd.checked"
                            @click="checkUpdate(true)" :disabled="upd.busy"
                            title="忽略缓存，强制回源查询">强制</button>
                    <span class="fs-xs" v-if="upd.msg"
                          :class="upd.has_update ? 'text-warning' : 'text-faint'">{{ upd.msg }}</span>
                  </span></div>
                <!-- 发现新版本时展开详情（含发布说明与升级指引） -->
                <div class="alert alert-warning" v-if="upd.has_update" style="margin-top:.5rem">
                  <div class="alert-title">发现新版本 {{ upd.latest_display }}</div>
                  <div class="fs-sm">
                    <div v-if="upd.published_at">发布于 {{ (upd.published_at || '').slice(0, 10) }}
                      <span class="text-faint">· 来源：{{
                        upd.source === 'release' ? 'GitHub Release' : 'VERSION 文件' }}</span></div>
                    <div v-if="upd.notes" class="fs-xs pre-wrap"
                         style="max-height:9rem;overflow:auto;margin-top:.4rem">{{ upd.notes }}</div>
                    <div class="fs-xs text-faint" style="margin-top:.5rem">
                      升级步骤见 docs/更新升级与完整性检查.md：先备份（数据库 + store/ + 配置）→ 拉取新版本 → 重启服务。
                    </div>
                    <a class="btn btn-xs btn-outline" style="margin-top:.5rem" v-if="upd.html_url"
                       :href="upd.html_url" target="_blank" rel="noopener noreferrer">在 GitHub 查看</a>
                    <button class="btn btn-xs btn-primary" style="margin-top:.5rem;margin-left:.5rem"
                            @click="applyUpdate()"
                            :disabled="upd.applying">
                      {{ upd.applying ? '更新中…' : '一键更新' }}</button>
                  </div>
                </div>
                <!-- 更新执行结果 -->
                <div class="alert" v-if="upd.apply_result"
                     :class="upd.apply_result.status === 'ok' ? 'alert-success' : 'alert-danger'"
                     style="margin-top:.5rem">
                  <div class="alert-title">{{ upd.apply_result.status === 'ok' ? '更新成功' : '更新失败' }}</div>
                  <div class="fs-sm">{{ upd.apply_result.message }}</div>
                  <div class="fs-xs text-faint pre-wrap" v-if="upd.apply_result.steps" style="margin-top:.3rem;max-height:12rem;overflow:auto">
                    <div v-for="s in upd.apply_result.steps" :key="s.step">
                      <span :class="s.ok ? 'text-success' : 'text-danger'">{{ s.ok ? '✓' : '✗' }}</span>
                      {{ s.step }}
                      <span v-if="s.stderr && !s.ok" class="text-danger">{{ s.stderr }}</span>
                    </div>
                  </div>
                </div>
                <div class="alert alert-info" v-if="upd.checked && !upd.has_update && upd.status === 'ok'"
                     style="margin-top:.5rem">
                  <div class="fs-sm">{{ upd.msg }}
                    <span class="text-faint" v-if="upd.cached">（缓存结果；点「强制」忽略缓存重查）</span></div>
                </div>
                <div class="alert alert-danger" v-if="upd.checked && upd.status === 'error'"
                     style="margin-top:.5rem">
                  <div class="alert-title">检查更新失败</div>
                  <div class="fs-sm">{{ upd.msg }}</div>
                  <div class="fs-xs text-faint">失败不会被当成「已是最新」—— 请先解决上面的原因再重试。</div>
                </div>
                <div class="kv"><span class="kv-k">构建引擎</span>
                  <span class="kv-v"><span class="badge" :class="ov.conf && ov.conf['builder.enabled'] ? 'badge-success' : 'badge-danger'">
                    {{ ov.conf && ov.conf['builder.enabled'] ? '已启用' : '已暂停' }}</span></span></div>
                <div class="kv"><span class="kv-k">构建后端</span>
                  <span class="kv-v">
                    <span class="badge badge-primary" v-if="backend.effective === 'github'">GitHub Actions</span>
                    <span class="badge" v-else>本机</span>
                    <span class="fs-xs text-faint" v-if="backend.configured !== backend.effective">
                      （配置为 {{ backend.configured }}，已回落）</span>
                  </span></div>
                <div class="kv"><span class="kv-k">邮件通知</span>
                  <span class="kv-v"><span class="badge" :class="mailReady ? 'badge-success' : 'badge-warning'">
                    {{ mailReady ? '可用' : '不可用' }}</span></span></div>
                <div class="kv"><span class="kv-k">在线支付</span>
                  <span class="kv-v"><span class="badge" :class="payInfo.info && payInfo.info.available ? 'badge-success' : ''">
                    {{ payInfo.info && payInfo.info.available ? '支付宝当面付' : '未启用' }}</span></span></div>
                <div class="kv"><span class="kv-k">下载链接有效期</span>
                  <span class="kv-v">{{ (ov.conf && ov.conf['download.link_ttl_hours']) || 72 }} 小时</span></div>
                <div class="kv"><span class="kv-k">默认插件配额</span>
                  <span class="kv-v">{{ (ov.conf && ov.conf.default_quota) || 12 }} 个</span></div>
                <div class="kv"><span class="kv-k">邮箱验证</span>
                  <span class="kv-v"><span class="badge" :class="(ov.conf && ov.conf['mail.verify_register']) ? 'badge-warning' : ''">
                    {{ (ov.conf && ov.conf['mail.verify_register']) ? '注册需验证' : '注册免验证' }}</span></span></div>
              </div>
            </div>

            <div class="card">
              <h4 class="mb-3">最近构建</h4>
              <div v-if="(ov.recent_builds || []).length" class="stack-sm">
                <div v-for="b in ov.recent_builds.slice(0, 8)" :key="b.request_hash"
                     class="row-between fs-sm">
                  <span class="truncate" style="max-width:180px">
                    {{ b.profile }} <span class="text-faint mono fs-xs">{{ b.request_hash.slice(0,8) }}</span>
                  </span>
                  <status-badge :status="b.status"></status-badge>
                </div>
              </div>
              <div v-else class="text-muted fs-sm">暂无构建记录</div>
            </div>
          </div>
        </section>

        <!-- ============ 用户 ============ -->
        <section v-if="tab === 'users'">
          <div class="row-between mb-4">
            <div><h2>用户管理</h2>
              <p class="text-muted fs-sm mt-1">共 {{ users.length }} 个账号</p></div>
            <div class="cluster-sm">
              <div class="search-wrap">
                <span class="search-icon"><svg viewBox="0 0 24 24" width="16" height="16" fill="none"
                  stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.6-3.6"/></svg></span>
                <input class="input input-sm" v-model.trim="userQ" placeholder="搜索用户名/邮箱" style="width:210px">
              </div>
              <button class="btn btn-primary btn-sm" @click="openCreateUser">新建用户</button>
            </div>
          </div>

          <div class="table-wrap">
            <div class="table-scroll">
              <table class="table table-responsive">
                <thead><tr>
                  <th>用户</th><th>邮箱</th><th>角色</th><th>状态</th><th>配额</th><th>最近登录</th><th class="actions">操作</th>
                </tr></thead>
                <tbody>
                  <tr v-for="u in filteredUsers" :key="u.username">
                    <td data-label="用户"><b>{{ u.username }}</b></td>
                    <td data-label="邮箱">
                      <span class="truncate" style="max-width:200px">{{ u.email || '—' }}</span>
                      <span class="badge badge-danger" v-if="u.email_verified === 0">未验证</span>
                    </td>
                    <td data-label="角色">
                      <span class="badge" :class="u.role === 'admin' ? 'badge-danger' : 'badge-primary'">
                        {{ u.role === 'admin' ? '管理员' : '用户' }}</span>
                    </td>
                    <td data-label="状态">
                      <span class="badge badge-success" v-if="!u.disabled">正常</span>
                      <span class="badge badge-danger" v-else>已停用</span>
                      <span class="badge badge-accent" v-if="u.sponsor">赞助</span>
                    </td>
                    <td data-label="配额">{{ u.quota }}</td>
                    <td data-label="最近登录" class="fs-xs text-muted">
                      {{ u.last_login ? K.datetime(u.last_login) : '从未' }}</td>
                    <td class="actions">
                      <div class="act-group">
                        <button class="btn btn-xs btn-outline" @click="editUser(u)">编辑</button>
                        <button class="btn btn-xs btn-outline" @click="sponsorUser(u)">赞助</button>
                        <button class="btn btn-xs btn-outline" v-if="u.email_verified === 0"
                                @click="adminReverify(u)">重发验证</button>
                        <button class="btn btn-xs btn-ghost" v-if="u.email_verified === 0"
                                @click="adminSetVerified(u)">手动通过</button>
                        <button class="btn btn-xs btn-danger-soft" @click="delUser(u)">删除</button>
                      </div>
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>
            <div class="empty" v-if="!filteredUsers.length"><p>没有匹配的用户</p></div>
          </div>
        </section>

        <!-- ============ 构建 ============ -->
        <section v-if="tab === 'builds'">
          <div class="row-between mb-4">
            <div><h2>构建任务</h2>
              <p class="text-muted fs-sm mt-1">共 {{ builds.length }} 条记录</p></div>
            <button class="btn btn-outline btn-sm" @click="loadBuilds">刷新</button>
          </div>

          <div class="table-wrap">
            <div class="table-scroll">
              <table class="table table-responsive">
                <thead><tr>
                  <th>任务</th><th>设备</th><th>版本</th><th>状态</th><th>耗时</th><th>时间</th><th class="actions">操作</th>
                </tr></thead>
                <tbody>
                  <tr v-for="b in builds" :key="b.request_hash">
                    <td data-label="任务" class="mono fs-xs">{{ b.request_hash.slice(0, 12) }}</td>
                    <td data-label="设备">
                      <div class="truncate" style="max-width:180px">{{ b.profile }}</div>
                      <div class="fs-xs text-faint">{{ b.target }}</div></td>
                    <td data-label="版本">{{ b.version || '—' }}</td>
                    <td data-label="状态"><status-badge :status="b.status"></status-badge></td>
                    <td data-label="耗时">{{ b.duration ? b.duration.toFixed(0) + 's' : '—' }}</td>
                    <td data-label="时间" class="fs-xs text-muted">{{ K.datetime(b.created) }}</td>
                    <td class="actions">
                      <div class="act-group">
                        <button class="btn btn-xs btn-outline" v-if="b.status === 'running' || b.status === 'queued'"
                                @click="buildAct(b, 'cancel')">取消</button>
                        <button class="btn btn-xs btn-outline" @click="buildAct(b, 'retry')">重试</button>
                        <a class="btn btn-xs btn-outline" v-if="b.has_artifacts !== false"
                           :href="'/store/' + b.request_hash + '/'" target="_blank" rel="noopener">产物</a>
                        <button class="btn btn-xs btn-danger-soft" @click="buildAct(b, 'delete')">删除</button>
                      </div>
                    </td>
                  </tr>
                  <!-- 失败任务错误详情（展开行） -->
                  <tr v-if="b.status === 'failed'" :key="b.request_hash + '-err'"
                      style="background:rgba(220,50,50,.06)">
                    <td colspan="7" style="padding:.6rem 1rem">
                      <div class="fs-xs" style="color:#c44">
                        <b>失败原因</b>
                        <span v-if="b.detail && b.detail !== 'tr-build-failed'"
                              style="margin-left:.5rem">{{ b.detail }}</span>
                      </div>
                      <template v-if="b.stderr && b.stderr.trim()">
                        <div class="fs-xs text-faint" style="margin:.3rem 0 2px">stderr：</div>
                        <pre class="fs-xs" style="white-space:pre-wrap;word-break:break-word;max-height:14rem;overflow:auto;background:#1a1010;color:#f99;padding:.4rem .6rem;border-radius:4px;margin:0">{{ b.stderr.trim() }}</pre>
                      </template>
                      <template v-if="b.stdout && b.stdout.trim()">
                        <details style="margin-top:.4rem">
                          <summary class="fs-xs" style="cursor:pointer;color:#888">展开 stdout（构建完整日志）</summary>
                          <pre class="fs-xs" style="white-space:pre-wrap;word-break:break-word;max-height:20rem;overflow:auto;background:#111;color:#bbb;padding:.4rem .6rem;border-radius:4px;margin-top:.3rem">{{ b.stdout.trim() }}</pre>
                        </details>
                      </template>
                      <div class="fs-xs text-faint" style="margin-top:.3rem"
                           v-if="!b.stderr && !b.stdout && (!b.detail || b.detail === 'tr-build-failed')">
                        无详细日志（任务数据可能已被截断）
                      </div>
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>
            <div class="empty" v-if="!builds.length"><p>暂无构建记录</p></div>
          </div>
        </section>

        <!-- ============ 队列存储 ============ -->
        <section v-if="tab === 'queue'">
          <h2 class="mb-4">队列与存储</h2>

          <div class="grid grid-2 mb-5">
            <div class="card">
              <h4 class="mb-3">构建队列</h4>
              <div class="stack-sm mb-4">
                <div class="kv"><span class="kv-k">运行中</span><span class="kv-v">{{ ov.queue_running || 0 }}</span></div>
                <div class="kv"><span class="kv-k">排队中</span><span class="kv-v">{{ ov.queue_queued || 0 }}</span></div>
                <div class="kv"><span class="kv-k">并发上限</span><span class="kv-v">{{ ov.concurrency || 2 }}</span></div>
              </div>
              <div class="cluster-sm">
                <button class="btn btn-sm btn-outline" @click="queueAct('clear_finished')">清空已结束任务</button>
                <button class="btn btn-sm btn-outline" @click="queueAct('resume')" v-if="ov.conf && !ov.conf['builder.enabled']">恢复构建引擎</button>
                <button class="btn btn-sm btn-danger-soft" @click="queueAct('pause')" v-else>暂停构建引擎</button>
              </div>
            </div>

            <div class="card">
              <h4 class="mb-3">存储</h4>
              <div class="stack-sm mb-4">
                <div class="kv"><span class="kv-k">磁盘占用</span><span class="kv-v">{{ ov.disk || '—' }}</span></div>
                <div class="kv"><span class="kv-k">产物占用</span><span class="kv-v">{{ ov.store_mb || '—' }}</span></div>
                <div class="kv"><span class="kv-k">磁盘可用</span><span class="kv-v">{{ ov.disk_free || '—' }}</span></div>
              </div>
              <button class="btn btn-sm btn-danger-soft" @click="queueAct('purge_store')">清空构建产物</button>
            </div>
          </div>

          <!-- 本地构建物：磁盘上实际存在的产物目录，逐个可见、可删 -->
          <div class="card">
            <div class="row-between mb-4">
              <div>
                <h4 class="mb-2">本地构建物</h4>
                <p class="fs-sm text-muted">
                  磁盘上实际存在的产物目录，按占用从大到小排列。
                  <span v-if="art.orphan_count">其中 <b>{{ art.orphan_count }}</b> 个是孤儿（构建记录已不存在）。</span>
                </p>
              </div>
              <div class="cluster-sm">
                <button class="btn btn-outline btn-sm" @click="loadArtifacts">刷新</button>
                <button class="btn btn-sm btn-danger-soft" v-if="art.orphan_count"
                        @click="orphanAct">清理孤儿目录</button>
              </div>
            </div>

            <div class="stack-sm mb-4">
              <div class="kv"><span class="kv-k">产物合计</span>
                <span class="kv-v">{{ K.bytes(art.total_bytes) }} / {{ art.total_files }} 个文件</span></div>

              <div class="kv"><span class="kv-k">用户上传</span>

            </div>

            <div class="table-wrap" v-if="art.items.length">
              <div class="table-scroll">
                <table class="table table-responsive">
                  <thead><tr>
                    <th>任务</th><th>属主</th><th>设备</th><th>大小</th><th>文件</th>
                    <th>时间</th><th>状态</th><th class="actions">操作</th>
                  </tr></thead>
                  <tbody>
                    <tr v-for="a in art.items" :key="a.request_hash">
                      <td data-label="任务" class="mono fs-xs">{{ a.request_hash.slice(0, 12) }}</td>
                      <td data-label="属主">{{ a.username || '—' }}</td>
                      <td data-label="设备">
                        <div class="truncate" style="max-width:160px">{{ a.profile || '—' }}</div>
                        <div class="fs-xs text-faint">{{ a.target }}</div></td>
                      <td data-label="大小">{{ K.bytes(a.bytes) }}</td>
                      <td data-label="文件">{{ a.files }}</td>
                      <td data-label="时间" class="fs-xs text-muted">{{ K.datetime(a.mtime) }}</td>
                      <td data-label="状态">
                        <span class="badge" v-if="a.orphan">孤儿</span>

                      </td>
                      <td class="actions">

                          <button class="btn btn-xs btn-danger-soft"

                        </div>
                      </td>
                    </tr>

                </table>

              未正确配置时会自动回落到本机构建。
            </p>
            <div class="grid grid-auto" style="gap:var(--sp-4)">
              <div class="kv"><span class="kv-k">当前配置</span><span class="kv-v">{{ backend.configured || '—' }}</span></div>
              <div class="kv"><span class="kv-k">实际生效</span><span class="kv-v"><b>{{ backend.effective || '—' }}</b></span></div>
              <div class="kv"><span class="kv-k">GitHub 可用</span>
                <span class="kv-v"><span class="badge" :class="backend.github_available ? 'badge-success' : 'badge-danger'">
                  {{ backend.github_available ? '是' : '否' }}</span></span></div>
            </div>
            <div class="cluster-sm mt-4">
              <button class="btn btn-sm" :class="backend.configured === 'local' ? 'btn-primary' : 'btn-outline'"
                      @click="setBackend('local')">使用本机构建</button>
              <button class="btn btn-sm" :class="backend.configured === 'github' ? 'btn-primary' : 'btn-outline'"
                      @click="setBackend('github')">使用 GitHub 构建</button>
              <button class="btn btn-sm btn-ghost" :class="{ 'is-loading': loading.ghtest }" @click="testGithub">测试 GitHub 连接</button>
            </div>
          </div>
        </section>

        <!-- ============ 站点设置 ============ -->
        <section v-if="tab === 'site'">
          <div class="row-between mb-4">
            <div><h2>站点设置</h2>
              <p class="text-muted fs-sm mt-1">
                共 {{ schema.length }} 项，{{ groups.length }} 个分组。改动立即生效。
              </p></div>
            <div class="cluster-sm">
              <span class="badge badge-info" v-if="dirtyCount">{{ dirtyCount }} 项待保存</span>
              <button class="btn btn-ghost btn-sm" :disabled="!dirtyCount" @click="resetCfg">放弃改动</button>
              <button class="btn btn-primary btn-sm" :class="{ 'is-loading': saving }"
                      :disabled="!dirtyCount || saving" @click="saveAllCfg">保存全部改动</button>
            </div>
          </div>

          <p class="alert alert-info mb-4" v-if="!dirtyCount" style="display:block">
            修改任意字段后，右上角会出现「保存全部改动」。敏感字段（密钥、密码）以掩码显示，
            留空或保持不变则不会覆盖库中原值。
          </p>

          <div class="stack">
            <details class="cfg-group" v-for="g in groups" :key="g.k" :open="g.k === 'brand'">
              <summary>
                {{ g.label }}
                <span class="badge" v-if="groupDirty(g.k)">{{ groupDirty(g.k) }} 项改动</span>
                <span class="fs-xs text-faint" style="font-weight:400">{{ g.desc }}</span>
              </summary>
              <div class="cfg-group-bd">
                <div class="grid grid-2" style="gap:var(--sp-4)">
                  <div class="field" v-for="f in fieldsOf(g.k)" :key="f.k"
                       :style="f.t === 'textarea' || f.t === 'json' ? 'grid-column:1/-1' : ''">
                    <label class="field-label" :for="'cfg-' + f.k">
                      {{ f.label }}
                      <span class="badge badge-danger" v-if="f.secret">密钥</span>
                      <span class="badge" v-if="f.nonDefault">已改</span>
                    </label>

                    <!-- 复选框 -->
                    <label class="switch" v-if="f.t === 'bool'">
                      <input type="checkbox" :id="'cfg-' + f.k" v-model="cfg[f.k]">
                      <span class="switch-track"></span>
                      <span class="fs-sm">{{ cfg[f.k] ? '开' : '关' }}</span>
                    </label>

                    <!-- 下拉 -->
                    <select v-else-if="f.t === 'select'" class="select" :id="'cfg-' + f.k" v-model="cfg[f.k]">
                      <option v-for="o in f.opts" :key="o" :value="o">{{ o }}</option>
                    </select>

                    <!-- 多行 -->
                    <textarea v-else-if="f.t === 'textarea'" class="textarea" :id="'cfg-' + f.k"
                              v-model="cfg[f.k]" rows="4"></textarea>

                    <!-- JSON（如赞助套餐） -->
                    <textarea v-else-if="f.t === 'json'" class="textarea mono" :id="'cfg-' + f.k"
                              v-model="cfgText[f.k]" rows="10"></textarea>

                    <!-- 数字 -->
                    <input v-else-if="f.t === 'number'" type="number" class="input" :id="'cfg-' + f.k"
                           v-model.number="cfg[f.k]" :min="f.min" :max="f.max">

                    <!-- 普通文本 / 密码 / 颜色 -->
                    <input v-else class="input" :id="'cfg-' + f.k"
                           :type="f.t === 'password' ? 'password' : (f.t === 'color' ? 'color' : 'text')"
                           v-model="cfg[f.k]">

                    <span class="field-hint" v-if="f.hint">{{ f.hint }}</span>
                  </div>
                </div>

                <!-- 赞助套餐可视化编辑器 -->
                <div v-if="g.k === 'sponsor'" class="mt-5">
                  <div class="row-between mb-3">
                    <b class="fs-sm">套餐可视化编辑</b>
                    <button class="btn btn-xs btn-outline" @click="addTier">新增套餐</button>
                  </div>
                  <div class="tier-grid">
                    <div v-for="(t, i) in tiersEdit" :key="i" class="card card-pad-sm">
                      <div class="field mb-2">
                        <label class="field-label">名称</label>
                        <input class="input input-sm" v-model="t.name">
                      </div>
                      <div class="grid grid-2" style="gap:var(--sp-2)">
                        <div class="field"><label class="field-label">金额</label>
                          <input class="input input-sm" type="number" v-model.number="t.amount"></div>
                        <div class="field"><label class="field-label">天数</label>
                          <input class="input input-sm" type="number" v-model.number="t.days"></div>
                      </div>
                      <div class="field mt-2">
                        <label class="field-label">权益（每行一条）</label>
                        <textarea class="textarea" rows="3"
                                  :value="(t.perks || []).join('\n')"
                                  @input="setPerks(i, $event.target.value)"></textarea>
                      </div>
                      <button class="btn btn-xs btn-danger-soft btn-block mt-2" @click="removeTier(i)">删除该套餐</button>
                    </div>
                  </div>
                  <p class="field-hint mt-3">套餐改动会并入上方「赞助设置」的保存动作。</p>
                </div>
              </div>
            </details>
          </div>
        </section>

        <!-- ============ 邮件通知 ============ -->
        <section v-if="tab === 'mail'">
          <h2 class="mb-4">邮件通知</h2>
          <div class="grid grid-2 mb-5">
            <div class="card">
              <h4 class="mb-3">发送测试邮件</h4>
              <p class="fs-sm text-muted mb-4">用于验证 SMTP 配置是否正确。会真实投递一封测试信。</p>
              <div class="input-group mb-3">
                <input class="input" type="email" v-model.trim="mailTestTo" placeholder="收件邮箱">
                <button class="btn btn-primary" :class="{ 'is-loading': loading.mailtest }"
                        :disabled="!mailTestTo" @click="testMail">发送</button>
              </div>
              <div class="kv"><span class="kv-k">当前状态</span>
                <span class="kv-v"><span class="badge" :class="mailReady ? 'badge-success' : 'badge-warning'">
                  {{ mailReady ? '可发送' : '未就绪' }}</span>
                  <span class="fs-xs text-faint" v-if="!mailReady">（{{ cfg['mail.enabled'] ? '参数不全' : '未启用' }}）</span>
                </span></div>
              <p class="field-hint mt-3">SMTP 参数在「站点设置 → 邮件通知」中配置。</p>
            </div>

            <div class="card">
              <h4 class="mb-3">投递记录</h4>
              <div class="stack-sm max-h-300 scroll-y" v-if="mailLog.length">
                <div v-for="m in mailLog.slice(0, 20)" :key="m.id || m.created" class="fs-sm">
                  <div class="row-between">
                    <span class="truncate" style="max-width:200px">{{ m.to_addr || m.to }}</span>
                    <span class="badge" :class="m.ok ? 'badge-success' : 'badge-danger'">{{ m.ok ? '成功' : '失败' }}</span>
                  </div>
                  <div class="fs-xs text-faint">{{ K.datetime(m.created) }}
                    <span v-if="m.detail" class="truncate"> · {{ m.detail }}</span></div>
                </div>
              </div>
              <div class="empty" v-else><p>暂无记录</p></div>
            </div>
          </div>
        </section>

        <!-- ============ 邮箱验证 ============ -->
        <section v-if="tab === 'verify'">
          <div class="row-between mb-4">
            <div><h2>邮箱验证</h2>
              <p class="text-muted fs-sm mt-1">注册验证令牌的签发与投递情况</p></div>
            <button class="btn btn-outline btn-sm" @click="loadVerifyStats">刷新</button>
          </div>

          <div class="grid grid-auto-sm mb-5">
            <div class="kpi"><div class="kpi-label">累计签发</div>
              <div class="kpi-value">{{ (verifyStats.email && verifyStats.email.total) || 0 }}</div>
              <div class="kpi-sub">有效 {{ (verifyStats.email && verifyStats.email.active) || 0 }}</div></div>
            <div class="kpi"><div class="kpi-label">已使用</div>
              <div class="kpi-value">{{ (verifyStats.email && verifyStats.email.used) || 0 }}</div>
              <div class="kpi-sub">过期待清理 {{ (verifyStats.email && verifyStats.email.expired) || 0 }}</div></div>
            <div class="kpi"><div class="kpi-label">投递成功</div>
              <div class="kpi-value text-success">{{ (verifyStats.email && verifyStats.email.sent_ok) || 0 }}</div>
              <div class="kpi-sub">失败 {{ (verifyStats.email && verifyStats.email.sent_failed) || 0 }}</div></div>
            <div class="kpi kpi-accent"><div class="kpi-label">未验证用户</div>
              <div class="kpi-value">{{ (verifyStats.email && verifyStats.email.unverified_users) || 0 }}</div>
              <div class="kpi-sub">无法登录，需完成验证</div></div>
          </div>

          <div class="card mb-5">
            <h4 class="mb-3">验证邮件投递记录</h4>
            <div class="table-wrap">
              <div class="table-scroll">
                <table class="table table-responsive">
                  <thead><tr><th>收件人</th><th>用户</th><th>结果</th><th>说明</th><th>时间</th></tr></thead>
                  <tbody>
                    <tr v-for="m in (verifyStats.email_send_log || [])" :key="m.id">
                      <td data-label="收件人" class="truncate" style="max-width:200px">{{ m.to_addr }}</td>
                      <td data-label="用户">{{ m.username || '—' }}</td>
                      <td data-label="结果">
                        <span class="badge" :class="m.ok ? 'badge-success' : 'badge-danger'">
                          {{ m.ok ? '成功' : '失败' }}</span></td>
                      <td data-label="说明" class="fs-xs text-muted truncate" style="max-width:240px">{{ m.detail || '—' }}</td>
                      <td data-label="时间" class="fs-xs text-muted">{{ K.datetime(m.created) }}</td>
                    </tr>
                  </tbody>
                </table>
              </div>
              <div class="empty" v-if="!(verifyStats.email_send_log || []).length"><p>暂无记录</p></div>
            </div>
          </div>

          <div class="alert alert-info" style="display:block">
            <b>开关位置：</b>「站点设置 → 邮件通知」中的
            <code>注册需邮箱验证</code>（当前：{{ cfg['mail.verify_register'] ? '已开启' : '已关闭' }}）
            与 <code>验证链接有效期</code>（{{ cfg['mail.verify_ttl_hours'] || 24 }} 小时）。
            <br><b>注意：</b>开启验证时，邮件服务必须可用，否则注册会被明确拒绝（不会产生无法登录的半成品账号）。
          </div>
        </section>

        <!-- ============ 下载链接 ============ -->
        <section v-if="tab === 'tokens'">
          <div class="row-between mb-4">
            <div><h2>下载链接</h2>
              <p class="text-muted fs-sm mt-1">共 {{ tokens.length }} 个令牌</p></div>
            <div class="cluster-sm">
              <button class="btn btn-outline btn-sm" @click="loadTokens">刷新</button>
              <button class="btn btn-danger-soft btn-sm" @click="tokenAct('cleanup')">清理过期</button>
            </div>
          </div>

          <div class="grid grid-auto-sm mb-5" v-if="tokenStats">
            <div class="kpi"><div class="kpi-label">总令牌</div>
              <div class="kpi-value">{{ tokenStats.total || 0 }}</div></div>
            <div class="kpi"><div class="kpi-label">有效</div>
              <div class="kpi-value text-success">{{ tokenStats.active || 0 }}</div></div>
            <div class="kpi"><div class="kpi-label">已过期</div>
              <div class="kpi-value">{{ tokenStats.expired || 0 }}</div></div>
            <div class="kpi"><div class="kpi-label">已吊销</div>
              <div class="kpi-value">{{ tokenStats.revoked || 0 }}</div></div>
            <div class="kpi"><div class="kpi-label">累计下载</div>
              <div class="kpi-value">{{ tokenStats.hits || 0 }}</div></div>
          </div>

          <div class="table-wrap">
            <div class="table-scroll">
              <table class="table table-responsive">
                <thead><tr>
                  <th>文件</th><th>构建</th><th>用户</th><th>剩余有效期</th><th>下载次数</th><th>状态</th><th class="actions">操作</th>
                </tr></thead>
                <tbody>
                  <tr v-for="t in tokens" :key="t.token || t.filename + t.request_hash">
                    <td data-label="文件" class="truncate" style="max-width:240px">{{ t.filename }}</td>
                    <td data-label="构建" class="mono fs-xs">{{ (t.request_hash || '').slice(0, 8) }}</td>
                    <td data-label="用户">{{ t.username || '匿名' }}</td>
                    <td data-label="剩余有效期">
                      <span class="badge" :class="t.expired ? 'badge-danger' : (t.remaining_hours < 6 ? 'badge-warning' : 'badge-success')">
                        {{ t.expired ? '已过期' : (t.remaining_hours + ' 小时') }}</span></td>
                    <td data-label="下载次数">{{ t.hits || 0 }}<span class="text-faint" v-if="t.max_hits">/{{ t.max_hits }}</span></td>
                    <td data-label="状态">
                      <span class="badge badge-danger" v-if="t.revoked">已吊销</span>
                      <span class="badge badge-success" v-else-if="!t.expired">有效</span>
                      <span class="badge" v-else>已过期</span></td>
                    <td class="actions">
                      <div class="act-group">
                        <button class="btn btn-xs btn-outline" @click="tokenItemAct(t, 'renew')">续期</button>
                        <button class="btn btn-xs btn-outline" @click="tokenItemAct(t, 'reissue')">重发</button>
                        <button class="btn btn-xs btn-danger-soft" v-if="!t.revoked"

                      </div>
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>
            <div class="empty" v-if="!tokens.length"><p>暂无下载令牌</p></div>
          </div>
        </section>

        <!-- ============ 赞助 ============ -->

              <div class="kpi-value">{{ (badges.claims || 0) }}</div></div>
            <div class="kpi"><div class="kpi-label">赞助用户</div>

            <div class="table-wrap">

                <table class="table table-responsive">
                  <thead><tr><th>用户</th><th>套餐</th><th>金额</th><th>备注</th><th>状态</th><th>提交时间</th><th class="actions">操作</th></tr></thead>

                      <td data-label="提交时间" class="fs-xs text-muted">{{ K.datetime(c.created) }}</td>

          </div>

                    {{ payInfo.info && payInfo.info.has_private_key ? '已配置' : '缺失' }}</span></span></div>
                <div class="kv"><span class="kv-k">支付宝公钥</span><span class="kv-v">
                  <span class="badge" :class="payInfo.info && payInfo.info.has_public_key ? 'badge-success' : 'badge-danger'">
                    {{ payInfo.info && payInfo.info.has_public_key ? '已配置' : '缺失' }}</span></span></div>
                <div class="kv"><span class="kv-k">环境</span><span class="kv-v">
                  <span class="badge" :class="(payInfo.info && payInfo.info.sandbox) ? 'badge-warning' : 'badge-success'">
                    {{ (payInfo.info && payInfo.info.sandbox) ? '沙箱' : '正式' }}</span></span></div>
                <div class="kv"><span class="kv-k">网关</span>
                  <span class="kv-v mono fs-xs break-all">{{ (payInfo.info && payInfo.info.gateway) || '—' }}</span></div>
                <div class="kv"><span class="kv-k">异步通知地址</span>
                  <span class="kv-v mono fs-xs break-all">{{ payInfo.notify_url || '—' }}</span></div>
                <div class="kv"><span class="kv-k">地址来源</span><span class="kv-v">
                  <span class="badge" :class="payInfo.notify_url_is_custom ? 'badge-warning' : 'badge-success'">
                    {{ payInfo.notify_url_is_custom ? '手动指定' : '自动推导' }}</span>
                  <span class="fs-xs text-faint" style="margin-left:8px"
                        v-if="!payInfo.notify_url_is_custom">按当前访问域名自动生成</span></span></div>
              </div>

              <div class="notify-box">
                <label class="field-label">把下面这一行填进支付宝开放平台的「异步通知地址」</label>
                <div class="copy-row">
                  <input class="input mono fs-xs" readonly :value="payInfo.notify_url || ''"
                         @focus="$event.target.select()" ref="notifyInput" aria-label="异步通知地址">
                  <button class="btn btn-sm btn-primary" @click="copyNotify">
                    复制</button>
                </div>
                <p class="field-hint">
                  该地址由站点自动推导（取当前协议的 Host）。若站点在反向代理 / CDN 之后，
                  可在「站点设置 → 在线支付 → 异步通知地址」中手动指定为公网地址覆盖它。
                </p>
                <p class="field-hint" v-if="payInfo.notify_url_auto && payInfo.notify_url_is_custom">
                  自动推导值：<span class="mono">{{ payInfo.notify_url_auto }}</span>
                </p>
              </div>

              <div class="cluster-sm">
                <button class="btn btn-sm btn-primary" :class="{ 'is-loading': loading.paytest }"
                        @click="testPay">测试下单（0.01 元）</button>
                <button class="btn btn-sm btn-ghost" @click="go('site')">去配置密钥</button>
              </div>
              <p class="field-hint mt-3">
                测试会在真实网关上创建一笔 0.01 元订单并立即关闭，用于验证签名与验签是否互通。
                密钥在「站点设置 → 在线支付」中填写。
              </p>
            </div>

            <div class="card">
              <h4 class="mb-3">订单统计</h4>
              <div class="grid grid-auto-sm" style="gap:var(--sp-3)">
                <div class="kpi"><div class="kpi-label">已支付</div>
                  <div class="kpi-value text-success">{{ payInfo.paid_count || 0 }}</div>
                  <div class="kpi-sub">金额 {{ payInfo.paid_amount || 0 }}</div></div>
                <div class="kpi"><div class="kpi-label">待人工确认</div>
                  <div class="kpi-value">{{ payInfo.pending_confirm || 0 }}</div>
                  <div class="kpi-sub">已收款未发放权益</div></div>
              </div>
              <div class="divider"></div>
              <div class="stack-sm" v-if="payInfo.by_status">
                <div class="kv" v-for="(v, k) in payInfo.by_status" :key="k">
                  <span class="kv-k">{{ payStatusText(k) }}</span>
                  <span class="kv-v">{{ v.count }} 笔 · {{ v.amount }}</span>
                </div>
              </div>
              <div class="alert alert-info mt-4" style="display:block">
                <b>异步通知与主动查单是双保险：</b>用户在支付宝付款后，即使关闭页面，
                只要配置的「异步通知地址」公网可达，支付宝也会回调本站完成权益发放。
                若站点在内网或未配公网地址，请引导用户付款后回到站点等待轮询确认。
              </div>
            </div>
          </div>

          <div class="card">
            <div class="row-between mb-4">
              <h4>订单记录</h4>
              <div class="cluster-sm">
                <select class="select select-sm" v-model="payFilter" @change="loadPayOrders" style="width:130px">
                  <option value="">全部状态</option>
                  <option value="paid">已支付</option>
                  <option value="paid_pending">待确认</option>
                  <option value="waiting">等待支付</option>
                  <option value="expired">已超时</option>
                  <option value="failed">下单失败</option>
                  <option value="cancelled">已取消</option>
                </select>
              </div>
            </div>
            <div class="table-wrap">
              <div class="table-scroll">
                <table class="table table-responsive">
                  <thead><tr>
                    <th>订单号</th><th>用户</th><th>套餐</th><th>金额</th><th>状态</th><th>支付宝交易号</th><th>时间</th><th class="actions">操作</th>
                  </tr></thead>
                  <tbody>
                    <tr v-for="o in payOrders" :key="o.out_trade_no">
                      <td data-label="订单号" class="mono fs-xs">{{ o.out_trade_no }}</td>
                      <td data-label="用户">{{ o.username }}</td>
                      <td data-label="套餐">{{ o.tier_name }}<span class="text-faint fs-xs"> / {{ o.days }}天</span></td>
                      <td data-label="金额">{{ o.amount }}</td>
                      <td data-label="状态">
                        <span class="badge badge-success" v-if="o.status === 'paid'">已支付</span>
                        <span class="badge badge-warning" v-else-if="o.status === 'paid_pending'">待确认</span>
                        <span class="badge badge-info" v-else-if="o.status === 'waiting'">等待支付</span>
                        <span class="badge badge-danger" v-else-if="o.status === 'failed'">下单失败</span>
                        <span class="badge" v-else>{{ payStatusText(o.status) }}</span></td>
                      <td data-label="支付宝交易号" class="mono fs-xs truncate" style="max-width:180px">{{ o.trade_no || '—' }}</td>
                      <td data-label="时间" class="fs-xs text-muted">{{ K.datetime(o.created) }}</td>
                      <td class="actions">
                        <div class="act-group">
                          <button class="btn btn-xs btn-primary" v-if="o.status === 'paid_pending'"
                                  @click="payOrderAct(o, 'confirm')">确认发放</button>
                          <button class="btn btn-xs btn-danger-soft"
                                  v-if="o.status !== 'paid' && o.status !== 'paid_pending'"
                                  @click="payOrderAct(o, 'close')">关闭</button>
                          <span class="fs-xs text-faint" v-else-if="o.status === 'paid'">已完成</span>
                        </div>
                      </td>
                    </tr>
                  </tbody>
                </table>
              </div>
              <div class="empty" v-if="!payOrders.length"><p>暂无订单记录</p></div>
            </div>
          </div>
        </section>

        <!-- ============ 退款审核 ============ -->
        <section v-if="tab === 'refund'">
          <div class="row-between mb-4">
            <div><h2>退款审核</h2>
              <p class="text-muted fs-sm mt-1">用户提交的退款申请，通过后将由支付宝原路退回并回收赞助天数</p></div>
            <button class="btn btn-outline btn-sm" @click="loadRefunds">刷新</button>
          </div>

          <div class="grid grid-auto-sm" style="gap:var(--sp-3)">
            <div class="kpi"><div class="kpi-label">待审核</div>
              <div class="kpi-value text-warning">{{ (refundStats.pending && refundStats.pending.count) || 0 }}</div></div>
            <div class="kpi"><div class="kpi-label">已退款</div>
              <div class="kpi-value text-success">{{ (refundStats.approved && refundStats.approved.count) || 0 }}</div>
              <div class="kpi-sub">{{ (refundStats.approved && refundStats.approved.amount) || 0 }} 元</div></div>
            <div class="kpi"><div class="kpi-label">已驳回</div>
              <div class="kpi-value">{{ (refundStats.rejected && refundStats.rejected.count) || 0 }}</div></div>
            <div class="kpi"><div class="kpi-label">退款失败</div>
              <div class="kpi-value text-danger">{{ (refundStats.failed && refundStats.failed.count) || 0 }}</div>
              <div class="kpi-sub">需人工介入</div></div>
          </div>

          <div class="card mt-5">
            <div class="row-between mb-4">
              <h4>申请列表</h4>
              <select class="select select-sm" v-model="refundFilter" @change="loadRefunds" style="width:140px">
                <option value="">全部状态</option>
                <option value="pending">待审核</option>
                <option value="approved">已退款</option>
                <option value="rejected">已驳回</option>
                <option value="failed">退款失败</option>
              </select>
            </div>
            <div class="table-wrap">
              <div class="table-scroll">
                <table class="table table-responsive">
                  <thead><tr>
                    <th>申请号</th><th>用户</th><th>订单号</th><th>金额</th><th>退款理由</th>
                    <th>状态</th><th>提交时间</th><th class="actions">操作</th>
                  </tr></thead>
                  <tbody>
                    <tr v-for="r in refunds" :key="r.id">
                      <td data-label="申请号" class="mono fs-xs">#{{ r.id }}</td>
                      <td data-label="用户">{{ r.username }}</td>
                      <td data-label="订单号" class="mono fs-xs truncate" style="max-width:170px">{{ r.out_trade_no }}</td>
                      <td data-label="金额">{{ r.amount }} 元</td>
                      <td data-label="退款理由" style="min-width:200px">
                        <div class="fs-sm">{{ r.reason }}</div>
                        <div class="fs-xs text-faint" v-if="r.detail">{{ r.detail }}</div>
                        <div class="fs-xs text-faint" v-if="r.review_note">审核备注：{{ r.review_note }}</div>
                        <div class="fs-xs text-danger" v-if="r.status === 'failed' && r.gateway_raw">
                          网关返回：{{ r.gateway_raw }}</div>
                      </td>
                      <td data-label="状态">
                        <span class="badge" :class="refundStatusBadge(r.status)">{{ r.status_text }}</span></td>
                      <td data-label="提交时间" class="fs-xs text-muted">{{ K.datetime(r.created) }}</td>
                      <td class="actions">
                        <div class="act-group">
                          <template v-if="r.status === 'pending'">
                            <button class="btn btn-xs btn-primary" @click="openRefund(r, 'approve')">同意退款</button>
                            <button class="btn btn-xs btn-ghost" @click="openRefund(r, 'reject')">驳回</button>
                          </template>
                          <span class="fs-xs text-faint" v-else>{{ r.reviewer || '—' }}</span>
                        </div>
                      </td>
                    </tr>
                  </tbody>
                </table>
              </div>
              <div class="empty" v-if="!refunds.length"><p>暂无退款申请</p></div>
            </div>
          </div>
        </section>

        <!-- ============ 插件目录 ============ -->
        <section v-if="tab === 'catalog'">
          <div class="row-between mb-4">
            <div><h2>插件目录</h2>
              <p class="text-muted fs-sm mt-1">
                构建时可供用户勾选的软件包与一键套件，改动立即对前台定制页生效</p></div>
            <div class="cluster-sm">
              <button class="btn btn-outline btn-sm" @click="loadCatalog">刷新</button>
              <button class="btn btn-ghost btn-sm" @click="resetCatalog">恢复默认</button>
            </div>
          </div>

          <div class="grid grid-auto-sm" style="gap:var(--sp-3)">
            <div class="kpi"><div class="kpi-label">软件包</div>
              <div class="kpi-value">{{ catalogCounts.presets || 0 }}</div></div>
            <div class="kpi"><div class="kpi-label">分类</div>
              <div class="kpi-value">{{ catalogCounts.cats || 0 }}</div></div>
            <div class="kpi"><div class="kpi-label">一键套件</div>
              <div class="kpi-value">{{ catalogCounts.suites || 0 }}</div></div>
          </div>

          <div class="tabs mt-5 mb-4">
            <button class="tab" :class="{ active: catTab === 'presets' }" @click="catTab = 'presets'">软件包</button>
            <button class="tab" :class="{ active: catTab === 'cats' }" @click="catTab = 'cats'">分类</button>
            <button class="tab" :class="{ active: catTab === 'suites' }" @click="catTab = 'suites'">一键套件</button>
          </div>

          <!-- 软件包 -->
          <template v-if="catTab === 'presets'">
            <div class="card mb-4">
              <h4 class="mb-3">新增软件包</h4>
              <div class="form-grid">
                <div class="field">
                  <label class="field-label">软件包名 <span class="req">*</span></label>
                  <input class="input mono" v-model.trim="catForm.name" placeholder="luci-app-example">
                  <p class="field-hint">必须与 OpenWrt 软件源中的真实包名一致，否则构建会失败</p>
                </div>
                <div class="field">
                  <label class="field-label">显示名称</label>
                  <input class="input" v-model.trim="catForm.label" placeholder="留空则用包名">
                </div>
                <div class="field">
                  <label class="field-label">所属分类</label>
                  <select class="select" v-model="catForm.cat">
                    <option value="">（默认分类）</option>
                    <option v-for="c in catalog.cats" :key="c.k" :value="c.k">{{ c.l }}</option>
                  </select>
                </div>
                <div class="field">
                  <label class="field-label">说明</label>
                  <input class="input" v-model.trim="catForm.desc" placeholder="一句话描述">
                </div>
              </div>
              <button class="btn btn-primary btn-sm mt-3" :class="{ 'is-loading': loading.catalogact }"
                      @click="addPreset">添加软件包</button>
            </div>

            <div class="card">
              <div class="row-between mb-4">
                <h4>软件包清单（{{ (catalog.presets || []).length }}）</h4>
                <input class="input input-sm" v-model.trim="catQ" placeholder="搜索包名 / 名称 / 说明"
                       style="max-width:260px">
              </div>
              <div class="table-wrap">
                <div class="table-scroll">
                  <table class="table table-responsive">
                    <thead><tr><th>软件包</th><th>显示名称</th><th>分类</th><th>说明</th><th class="actions">操作</th></tr></thead>
                    <tbody>
                      <tr v-for="p in catalogFiltered" :key="p.n">
                        <td data-label="软件包" class="mono fs-xs">{{ p.n }}</td>
                        <td data-label="显示名称">{{ p.l }}</td>
                        <td data-label="分类"><span class="badge">{{ catName(p.c) }}</span></td>
                        <td data-label="说明" class="fs-sm text-muted">{{ p.d || '—' }}</td>
                        <td class="actions">
                          <button class="btn btn-xs btn-danger-soft" @click="removePreset(p)">删除</button>
                        </td>
                      </tr>
                    </tbody>
                  </table>
                </div>
                <div class="empty" v-if="!catalogFiltered.length"><p>没有匹配的软件包</p></div>
              </div>
            </div>
          </template>

          <!-- 分类 -->
          <template v-if="catTab === 'cats'">
            <div class="card mb-4">
              <h4 class="mb-3">新增分类</h4>
              <div class="form-grid">
                <div class="field">
                  <label class="field-label">标识 <span class="req">*</span></label>
                  <input class="input mono" v-model.trim="catNewCat.key" placeholder="例如 nas">
                  <p class="field-hint">仅字母、数字、下划线、连字符</p>
                </div>
                <div class="field">
                  <label class="field-label">显示名称 <span class="req">*</span></label>
                  <input class="input" v-model.trim="catNewCat.label" placeholder="例如 网络存储">
                </div>
              </div>
              <button class="btn btn-primary btn-sm mt-3" @click="addCat">添加分类</button>
            </div>
            <div class="card">
              <h4 class="mb-4">分类清单（{{ (catalog.cats || []).length }}）</h4>
              <div class="table-wrap">
                <div class="table-scroll">
                  <table class="table table-responsive">
                    <thead><tr><th>标识</th><th>显示名称</th><th>软件包数</th><th class="actions">操作</th></tr></thead>
                    <tbody>
                      <tr v-for="c in catalog.cats" :key="c.k">
                        <td data-label="标识" class="mono fs-xs">{{ c.k }}</td>
                        <td data-label="显示名称">{{ c.l }}</td>
                        <td data-label="软件包数">
                          {{ (catalog.presets || []).filter(function (p) { return p.c === c.k; }).length }}</td>
                        <td class="actions">
                          <button class="btn btn-xs btn-danger-soft" @click="removeCat(c)">删除</button>
                        </td>
                      </tr>
                    </tbody>
                  </table>
                </div>
              </div>
            </div>
          </template>

          <!-- 套件 -->
          <template v-if="catTab === 'suites'">
            <div class="card mb-4">
              <h4 class="mb-3">新增一键套件</h4>
              <div class="form-grid">
                <div class="field">
                  <label class="field-label">标识 <span class="req">*</span></label>
                  <input class="input mono" v-model.trim="catNewSuite.key" placeholder="例如 myproxy">
                </div>
                <div class="field">
                  <label class="field-label">显示名称</label>
                  <input class="input" v-model.trim="catNewSuite.label" placeholder="例如 我的代理组合">
                </div>
                <div class="field" style="grid-column:1/-1">
                  <label class="field-label">包含的软件包 <span class="req">*</span></label>
                  <input class="input mono" v-model.trim="catNewSuite.pkgs"
                         placeholder="luci-app-a, luci-app-b">
                  <p class="field-hint">多个包用逗号或空格分隔，勾选该套件时会一并加入构建</p>
                </div>
              </div>
              <button class="btn btn-primary btn-sm mt-3" @click="addSuite">添加套件</button>
            </div>
            <div class="card">
              <h4 class="mb-4">套件清单（{{ (catalog.suites || []).length }}）</h4>
              <div class="table-wrap">
                <div class="table-scroll">
                  <table class="table table-responsive">
                    <thead><tr><th>标识</th><th>显示名称</th><th>包含软件包</th><th class="actions">操作</th></tr></thead>
                    <tbody>
                      <tr v-for="s in catalog.suites" :key="s.k">
                        <td data-label="标识" class="mono fs-xs">{{ s.k }}</td>
                        <td data-label="显示名称">{{ s.l }}</td>
                        <td data-label="包含软件包" class="mono fs-xs">
                          {{ (s.pkgs || []).join(', ') }}</td>
                        <td class="actions">
                          <button class="btn btn-xs btn-danger-soft" @click="removeSuite(s)">删除</button>
                        </td>
                      </tr>
                    </tbody>
                  </table>
                </div>
              </div>
            </div>
          </template>
        </section>

        <!-- 退款审核弹窗 -->
        <div class="modal-mask" v-if="refundModal" @click.self="closeRefund">
          <div class="modal">
            <div class="modal-hd">
              <h3>{{ refundModal.action === 'approve' ? '同意退款' : '驳回退款申请' }}</h3>
              <button class="btn btn-ghost btn-icon btn-sm" @click="closeRefund" aria-label="关闭">✕</button>
            </div>
            <div class="modal-bd">
              <div class="kv-list mb-4">
                <div class="kv"><span class="kv-k">申请号</span><span class="kv-v mono">#{{ refundModal.req.id }}</span></div>
                <div class="kv"><span class="kv-k">用户</span><span class="kv-v">{{ refundModal.req.username }}</span></div>
                <div class="kv"><span class="kv-k">订单号</span><span class="kv-v mono fs-xs">{{ refundModal.req.out_trade_no }}</span></div>
                <div class="kv"><span class="kv-k">退款金额</span><span class="kv-v">{{ refundModal.req.amount }} 元</span></div>
                <div class="kv"><span class="kv-k">退款理由</span><span class="kv-v">{{ refundModal.req.reason }}</span></div>
              </div>
              <div class="field">
                <label class="field-label">审核备注</label>
                <textarea class="textarea" v-model="refundNote" rows="3"
                          placeholder="可填写处理说明，用户可见"></textarea>
              </div>
              <label class="check mt-3" v-if="refundModal.action === 'approve'">
                <input type="checkbox" v-model="refundOffline">
                <span>已通过线下渠道退款（不调用支付宝网关，仅标记并回收权益）</span>
              </label>
              <div class="alert alert-warning mt-4" style="display:block"
                   v-if="refundModal.action === 'approve' && !refundOffline">
                <b>将通过支付宝发起真实退款</b>，资金原路退回用户账户；同时回收该订单对应的赞助天数。
                网关退款失败时状态会记为「退款失败」，权益不会回收。
              </div>
            </div>
            <div class="modal-ft">
              <button class="btn btn-ghost" @click="closeRefund">取消</button>
              <button class="btn" :class="refundModal.action === 'approve' ? 'btn-primary' : 'btn-danger'"
                      :class="{ 'is-loading': loading.refundact }" @click="refundAct">
                {{ refundModal.action === 'approve' ? '确认退款' : '确认驳回' }}</button>
            </div>
          </div>
        </div>

        <!-- ============ 插件提议 ============ -->
        <section v-if="tab === 'prop'">
          <div class="row-between mb-4">
            <div><h2>插件提议</h2>
              <p class="text-muted fs-sm mt-1">用户提交的软件包需求</p></div>
            <button class="btn btn-outline btn-sm" @click="loadProp">刷新</button>
          </div>
          <div class="stack">
            <div class="card" v-for="p in props" :key="p.id">
              <div class="row-between mb-3">
                <div>
                  <b>{{ p.name }}</b>
                  <span class="badge ml-2" :class="p.status === 'pending' ? 'badge-warning' : (p.status === 'approved' ? 'badge-success' : '')">
                    {{ p.status === 'pending' ? '待处理' : (p.status === 'approved' ? '已采纳' : '已拒绝') }}</span>
                </div>
                <span class="fs-xs text-faint">{{ K.datetime(p.created) }} · {{ p.username || '匿名' }}</span>
              </div>
              <p class="fs-sm text-muted pre-wrap">{{ p.reason || p.note || '（未填写说明）' }}</p>
              <div class="cluster-sm mt-3" v-if="p.status === 'pending'">
                <input class="input input-sm" v-model.trim="p._reply" placeholder="回复（可选）" style="max-width:280px">
                <button class="btn btn-sm btn-primary" @click="propAct(p, 'approve')">采纳</button>
                <button class="btn btn-sm btn-danger-soft" @click="propAct(p, 'reject')">拒绝</button>
              </div>
              <div class="alert alert-info mt-3 fs-sm" style="display:block" v-else-if="p.reply">
                回复：{{ p.reply }}
              </div>
            </div>
          </div>
          <div class="empty" v-if="!props.length"><p>暂无插件提议</p></div>
        </section>

        <!-- ============ 封禁 ============ -->
        <section v-if="tab === 'bans'">
          <h2 class="mb-4">访问封禁</h2>
          <div class="card mb-5">
            <h4 class="mb-3">新增封禁</h4>
            <div class="grid grid-3" style="gap:var(--sp-3)">
              <div class="field">
                <label class="field-label">类型</label>
                <select class="select" v-model="banForm.type">
                  <option value="ip">IP 地址</option>
                  <option value="user">用户名</option>
                </select>
              </div>
              <div class="field">
                <label class="field-label">目标</label>
                <input class="input" v-model.trim="banForm.value" placeholder="IP 或用户名">
              </div>
              <div class="field">
                <label class="field-label">原因</label>
                <input class="input" v-model.trim="banForm.reason" placeholder="可选">
              </div>
            </div>
            <button class="btn btn-primary btn-sm mt-3" :disabled="!banForm.value" @click="addBan">添加封禁</button>
          </div>

          <div class="table-wrap">
            <div class="table-scroll">
              <table class="table table-responsive">
                <thead><tr><th>类型</th><th>目标</th><th>原因</th><th>时间</th><th class="actions">操作</th></tr></thead>
                <tbody>
                  <tr v-for="b in bans" :key="b.id || b.value">
                    <td data-label="类型">
                      <span class="badge">{{ b.type === 'ip' ? 'IP' : '用户' }}</span></td>
                    <td data-label="目标" class="mono">{{ b.value }}</td>
                    <td data-label="原因" class="truncate" style="max-width:260px">{{ b.reason || '—' }}</td>
                    <td data-label="时间" class="fs-xs text-muted">{{ K.datetime(b.created) }}</td>
                    <td class="actions">
                      <button class="btn btn-xs btn-danger-soft" @click="rmBan(b)">解除</button>
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>
            <div class="empty" v-if="!bans.length"><p>当前无封禁记录</p></div>
          </div>
        </section>

        <!-- ============ 审计日志 ============ -->
        <section v-if="tab === 'logs'">
          <div class="row-between mb-4">
            <div><h2>审计日志</h2>
              <p class="text-muted fs-sm mt-1">最近 {{ logs.length }} 条管理操作</p></div>
            <div class="cluster-sm">
              <button class="btn btn-outline btn-sm" @click="loadLogs">刷新</button>
              <button class="btn btn-danger-soft btn-sm" @click="clearLogs">清空日志</button>
            </div>
          </div>
          <div class="table-wrap">
            <div class="table-scroll">
              <table class="table table-responsive">
                <thead><tr><th>时间</th><th>操作者</th><th>动作</th><th>对象</th><th>详情</th><th>来源 IP</th></tr></thead>
                <tbody>
                  <tr v-for="l in logs" :key="l.id">
                    <td data-label="时间" class="fs-xs text-muted nowrap">{{ K.datetime(l.created) }}</td>
                    <td data-label="操作者">{{ l.actor }}</td>
                    <td data-label="动作"><span class="tag">{{ l.action }}</span></td>
                    <td data-label="对象">{{ l.target || '—' }}</td>
                    <td data-label="详情" class="fs-xs text-muted truncate" style="max-width:300px">{{ l.detail || '—' }}</td>
                    <td data-label="来源 IP" class="mono fs-xs">{{ l.ip || '—' }}</td>
                  </tr>
                </tbody>
              </table>
            </div>
            <div class="empty" v-if="!logs.length"><p>暂无日志</p></div>
          </div>
        </section>

      </main>
    </div>
  </template>
<!-- ============ 用户编辑弹窗 ============ -->
<div class="modal-mask" v-if="userModal" @click.self="userModal = null">
  <div class="modal modal-sm">
    <div class="modal-hd">
      <h3>{{ userModal.mode === 'create' ? '新建用户' : '编辑用户' }}</h3>
      <span class="spacer"></span>
      <button class="btn btn-ghost btn-icon btn-sm" @click="userModal = null" aria-label="关闭">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <div class="modal-bd" id="user-modal-bd">
      <div class="stack">
        <div class="field">
          <label class="field-label">用户名</label>
          <input class="input" v-model.trim="userModal.username" :disabled="userModal.mode === 'edit'">
        </div>
        <div class="field">
          <label class="field-label">邮箱</label>
          <input class="input" type="email" v-model.trim="userModal.email">
        </div>
        <div class="field">
          <label class="field-label">{{ userModal.mode === 'create' ? '密码' : '重置密码（留空不改）' }}</label>
          <input class="input" type="password" v-model="userModal.password" placeholder="至少 6 位">
        </div>
        <div class="grid grid-2" style="gap:var(--sp-3)">
          <div class="field">
            <label class="field-label">角色</label>
            <select class="select" v-model="userModal.role">
              <option value="user">普通用户</option>
              <option value="admin">管理员</option>
            </select>
          </div>
          <div class="field">
            <label class="field-label">插件配额</label>
            <input class="input" type="number" min="0" v-model.number="userModal.quota">
          </div>
        </div>
        <label class="switch">
          <input type="checkbox" v-model="userModal.disabled">
          <span class="switch-track"></span>
          <span class="fs-sm">停用该账号</span>
        </label>
      </div>
    </div>
    <div class="modal-ft">
      <button class="btn btn-outline" @click="userModal = null">取消</button>
      <button class="btn btn-primary" :class="{ 'is-loading': loading.usersave }" @click="saveUser">保存</button>
    </div>
  </div>
</div>

<!-- ============ 授予赞助弹窗 ============ -->
<div class="modal-mask" v-if="sponsorModal" @click.self="sponsorModal = null">
  <div class="modal modal-sm">
    <div class="modal-hd">
      <h3>授予赞助 · {{ sponsorModal.username }}</h3>
      <span class="spacer"></span>
      <button class="btn btn-ghost btn-icon btn-sm" @click="sponsorModal = null" aria-label="关闭">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <div class="modal-bd">
      <div class="alert alert-info mb-4" style="display:block">
        当前状态：<template v-if="sponsorModal.sponsor && sponsorModal.until">
          赞助中，{{ K.datetime(sponsorModal.until) }} 到期</template>
        <template v-else>未赞助</template>
        <br>授予时会从现有到期时间顺延，不吞掉剩余天数。
      </div>
      <div class="stack">
        <div class="field">
          <label class="field-label">套餐</label>
          <select class="select" v-model="sponsorModal.tier">
            <option v-for="t in tiersEdit" :key="t.name" :value="t.name">{{ t.name }}（{{ t.days }} 天）</option>
            <option value="__custom">自定义天数</option>
          </select>
        </div>
        <div class="field" v-if="sponsorModal.tier === '__custom'">
          <label class="field-label">天数</label>
          <input class="input" type="number" min="1" v-model.number="sponsorModal.days">
        </div>
        <button class="btn btn-outline btn-block" @click="sponsorAct('revoke')"
                v-if="sponsorModal.sponsor">撤销赞助</button>
      </div>
    </div>
    <div class="modal-ft">
      <button class="btn btn-outline" @click="sponsorModal = null">取消</button>
      <button class="btn btn-primary" @click="sponsorAct('grant')">授予</button>
    </div>
  </div>
</div>

</div>

<script src="/vendor/vue.global.prod.js"></script>
<script src="/vendor/jquery.min.js"></script>
<script src="/assets/js/common.js"></script>
<script src="/assets/js/admin.js"></script>
</body>
</html>
