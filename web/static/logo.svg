<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" role="img" aria-label="夏诗意">
  <defs>
    <linearGradient id="xsp-bg" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0%" stop-color="#4a63ed"/>
      <stop offset="100%" stop-color="#232a7b"/>
    </linearGradient>
    <linearGradient id="xsp-sun" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffd977"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>

  <!-- 印章底板 -->
  <rect width="48" height="48" rx="13" fill="url(#xsp-bg)"/>

  <!-- 设备基座：横卧一笔，锚定视觉重心 -->
  <rect x="13" y="34" width="21" height="5.2" rx="2.6" fill="#ffffff" opacity=".92"/>

  <!-- 信号笔触：由左下提起，笔锋穿入日点，形成一体 -->
  <path d="M13.5 29.5 Q 23 16.5 34 19.6"
        fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>

  <!-- 夏 · 日点：笔锋收于此 -->
  <circle cx="34" cy="19.6" r="6" fill="url(#xsp-sun)"/>
</svg>
