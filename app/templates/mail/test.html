<p style="margin:0 0 14px;font-size:15px">SMTP 配置测试成功</p>
<p style="margin:0 0 18px;color:#334155;line-height:1.75">
  收到此邮件说明 <b>{{site}}</b> 的 SMTP 配置正确，构建完成通知可以正常投递。
</p>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"
       style="border:1px solid #e2e8f0;border-radius:8px;overflow:hidden;font-size:14px">
  <tr><td style="padding:10px 14px;background:#f8fafc;color:#64748b;width:34%">SMTP 服务器</td>
      <td style="padding:10px 14px">{{host}}</td></tr>
  <tr><td style="padding:10px 14px;background:#f8fafc;color:#64748b">加密方式</td>
      <td style="padding:10px 14px">{{enc}}</td></tr>
  <tr><td style="padding:10px 14px;background:#f8fafc;color:#64748b">发件人</td>
      <td style="padding:10px 14px">{{from_addr}}</td></tr>
  <tr><td style="padding:10px 14px;background:#f8fafc;color:#64748b">发送时间</td>
      <td style="padding:10px 14px">{{now}}</td></tr>
